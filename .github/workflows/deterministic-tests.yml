# Deterministik katmanlarin birim testleri.
#
# KAPSAM NOTU: Bu hat sistemin TAMAMINI test etmez. Uctan uca test (test_qa.py)
# Foundry Local, GPU ve yuklu modeller gerektirir; GitHub Actions'ta kosturulamaz.
# Burada yalnizca modelden bagimsiz, saf fonksiyon olarak yazilmis savunma
# katmanlari kosuluyor (sozcuksel kapi, ozel isim/sayi dayanagi, yinelenme
# tespiti, uzunluk siniri, kaynak satiri, kopyalama olcutu).
#
# Amac: bu kurallarda gerileme olursa push aninda gorunur olsun.

name: Deterministik testler

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Python kurulumu
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Bagimliliklar
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Deterministik testler
        run: python test_deterministic.py
